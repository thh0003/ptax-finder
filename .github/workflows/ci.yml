name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ptax
          POSTGRES_PASSWORD: ptax
          POSTGRES_DB: ptax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptax -d ptax"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Services cannot pass a command, and MinIO needs `server /data`: start it here.
      - name: Start MinIO and create the buckets
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live
          for bucket in ptax-uploads ptax-pipeline; do
            aws --endpoint-url http://localhost:9000 s3 mb "s3://$bucket"
          done
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm lint
      - run: pnpm test

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
